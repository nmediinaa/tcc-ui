<div class="chat-page">
  <!-- TOPO -->
  <div class="chat-top">
    <button class="back-btn" routerLink="/">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Voltar
    </button>

    <div class="chat-top-info">
      <div>
        <h2>CHAT</h2>
      </div>
    </div>

    <div class="top-spacer"></div>
  </div>

  <!-- MENSAGENS -->
  <!-- #chatScroll é o elemento que você vai referenciar no TS pra fazer o scroll descer -->
  <div class="chat-messages" #chatScroll>
    <div class="chat-messages-inner">
      <!-- Mensagem da IA. No TS, substitua por *ngFor percorrendo o array de mensagens -->

      <div
        class="msg-row"
        [ngClass]="msg.role === 'ai' ? 'ai' : 'user'"
        *ngFor="let msg of messages"
      >
        <div class="avatar ai-avatar" *ngIf="msg.role === 'ai'">IA</div>
        <div class="msg-bubble" [ngClass]="msg.role === 'ai' ? 'ai-bubble' : 'user-bubble'">
          {{ msg.text }}
        </div>
      </div>

      <!-- Indicador de "digitando..." — controle a exibição via *ngIf no TS -->
      <div class="msg-row ai typing-row" *ngIf="showDiv()">
        <div class="avatar ai-avatar">IA</div>
        <div class="typing-bubble"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="chat-input-bar">
    <div class="chat-input-inner">
      <input
        type="text"
        class="chat-input"
        placeholder="Digite sua resposta..."
        [(ngModel)]="userMsg"
      />
      <button class="send-btn" aria-label="Enviar mensagem" (click)="sendMessage()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>
